<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ginoteca — Command Center v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --ink:#1a1410;--ink-60:rgba(26,20,16,.6);--ink-20:rgba(26,20,16,.1);
  --cream:#f7f2e8;--parchment:#ede6d6;--parch2:#e3dac8;--white:#fdfaf4;
  --terra:#b84a20;--terra-l:#f5e0d4;--terra-m:#e8c0a8;
  --olive:#3d5a3e;--olive-l:#d8e8d8;--olive-m:#b0ceb0;
  --amber:#b8780a;--amber-l:#faecd4;--amber-m:#eac888;
  --slate:#3a4a5c;--slate-l:#d8e0ec;
  --danger:#9e2020;--danger-l:#f5d8d8;
  --border:rgba(26,20,16,.11);--border-med:rgba(26,20,16,.18);
  --fd:'Bebas Neue',sans-serif;--fs:'DM Serif Display',serif;
  --fb:'Instrument Sans',sans-serif;--fm:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--parchment);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.5;min-height:100vh;}

/* SHELL */
.shell{display:grid;grid-template-columns:220px 1fr;grid-template-rows:58px 1fr;min-height:100vh;}

/* TOPBAR */
.topbar{grid-column:1/-1;background:var(--white);border-bottom:1px solid var(--border-med);padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px var(--ink-20);}
.tb-brand{display:flex;align-items:baseline;gap:12px;}
.tb-logo{font-family:var(--fd);font-size:26px;letter-spacing:.06em;color:var(--terra);line-height:1;}
.tb-tag{font-family:var(--fm);font-size:10px;color:var(--ink-60);letter-spacing:.1em;text-transform:uppercase;}
.tb-right{display:flex;align-items:center;gap:14px;}
.tb-date{font-family:var(--fm);font-size:11px;color:var(--ink-60);}
.tb-phase{font-family:var(--fm);font-size:10px;padding:4px 11px;border-radius:4px;background:var(--terra-l);color:var(--terra);border:1px solid var(--terra-m);letter-spacing:.08em;text-transform:uppercase;}

/* SIDEBAR */
.sidebar{background:var(--white);border-right:1px solid var(--border-med);padding:20px 0;display:flex;flex-direction:column;position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;}
.sb-lbl{font-family:var(--fm);font-size:9px;color:var(--ink-60);letter-spacing:.14em;text-transform:uppercase;padding:12px 18px 5px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 18px;cursor:pointer;color:var(--ink-60);font-size:13px;transition:all .13s;border-left:2px solid transparent;user-select:none;}
.nav-item:hover{color:var(--ink);background:var(--parchment);}
.nav-item.active{color:var(--terra);border-left-color:var(--terra);background:var(--terra-l);font-weight:500;}
.nav-item .ni{width:15px;font-size:13px;}
.sb-prog{margin:16px 14px 0;background:var(--parchment);border-radius:6px;border:1px solid var(--border);padding:13px;}
.sp-lbl{font-family:var(--fm);font-size:9px;color:var(--ink-60);letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px;}
.sp-track{height:3px;background:var(--border-med);border-radius:2px;margin-bottom:6px;overflow:hidden;}
.sp-fill{height:100%;border-radius:2px;background:var(--terra);transition:width .5s ease;}
.sp-pct{font-family:var(--fm);font-size:12px;color:var(--terra);font-weight:500;}

/* MAIN */
.main{background:var(--cream);padding:28px 32px;overflow-y:auto;}
.page{display:none;}.page.active{display:block;}

/* KPI STRIP */
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:28px;}
.kpi{background:var(--white);border:1px solid var(--border-med);border-radius:10px;padding:17px 19px;position:relative;overflow:hidden;transition:box-shadow .17s;}
.kpi:hover{box-shadow:0 3px 14px var(--ink-20);}
.kpi::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;}
.kpi.kt::after{background:var(--terra)}.kpi.kd::after{background:var(--danger)}.kpi.ko::after{background:var(--olive)}.kpi.ka::after{background:var(--amber)}.kpi.ks::after{background:var(--slate)}
.kpi-lbl{font-family:var(--fm);font-size:9px;color:var(--ink-60);letter-spacing:.14em;text-transform:uppercase;margin-bottom:7px;}
.kpi-val{font-family:var(--fd);font-size:34px;letter-spacing:.02em;line-height:1;color:var(--ink);margin-bottom:3px;}
.kpi-sub{font-family:var(--fm);font-size:10px;color:var(--ink-60);}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.kpi{animation:fadeUp .35s ease both;}
.kpi:nth-child(1){animation-delay:.04s}.kpi:nth-child(2){animation-delay:.09s}.kpi:nth-child(3){animation-delay:.14s}.kpi:nth-child(4){animation-delay:.19s}

/* SECTION HEADER */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sec-title{font-family:var(--fs);font-size:18px;color:var(--ink);font-style:italic;}
.sec-meta{font-family:var(--fm);font-size:10px;color:var(--ink-60);letter-spacing:.06em;}

/* WEEK GRID */
.week-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:28px;}
.wcard{background:var(--white);border:1px solid var(--border-med);border-radius:10px;overflow:hidden;transition:box-shadow .17s;}
.wcard:hover{box-shadow:0 2px 12px var(--ink-20);}
.wc-hdr{padding:12px 16px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--parchment);}
.wc-w{font-family:var(--fd);font-size:12px;letter-spacing:.1em;color:var(--ink-60);}
.wc-t{font-size:12px;font-weight:500;color:var(--ink);margin-top:2px;}
.wc-badge{font-family:var(--fm);font-size:9px;padding:3px 8px;border-radius:3px;letter-spacing:.06em;text-transform:uppercase;background:var(--parch2);color:var(--ink-60);border:1px solid var(--border-med);}
.wc-body{padding:7px 0;}
.wp{display:flex;gap:8px;align-items:center;padding:7px 16px 2px;}
.wp-track{flex:1;height:2px;background:var(--border-med);border-radius:1px;overflow:hidden;}
.wp-fill{height:100%;border-radius:1px;transition:width .5s ease;}
.wp-lbl{font-family:var(--fm);font-size:9px;color:var(--ink-60);white-space:nowrap;}

/* TASK ROWS */
.trow{display:grid;grid-template-columns:18px 1fr auto;gap:9px;padding:7px 15px;align-items:start;cursor:pointer;transition:background .11s;border-radius:5px;margin:0 4px 2px;}
.trow:hover{background:var(--parchment);}
.trow.done .tname{text-decoration:line-through;opacity:.4;}
.trow.done .tdot{background:var(--olive)!important;border-color:var(--olive)!important;}
.tdot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--border-med);margin-top:2px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .13s;background:var(--white);}
.tdot.urg{border-color:var(--danger);}
.tname{font-size:13px;color:var(--ink);line-height:1.4;}
.tchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
.chip{font-family:var(--fm);font-size:9px;padding:2px 6px;border-radius:3px;letter-spacing:.05em;text-transform:uppercase;}
.ch-admin{background:var(--slate-l);color:var(--slate);border:1px solid rgba(58,74,92,.2);}
.ch-infra{background:var(--terra-l);color:var(--terra);border:1px solid var(--terra-m);}
.ch-compra{background:var(--olive-l);color:var(--olive);border:1px solid var(--olive-m);}
.ch-comerc{background:#ede8f8;color:#5c3a8c;border:1px solid #ccc0e8;}
.ch-urg{background:var(--danger-l);color:var(--danger);border:1px solid rgba(158,32,32,.25);}
.ch-pesos{background:var(--amber-l);color:var(--amber);border:1px solid var(--amber-m);}
.ch-who{background:var(--parch2);color:var(--ink-60);border:1px solid var(--border-med);}
.ch-date{background:var(--parch2);color:var(--ink-60);border:1px solid var(--border-med);}
.tright{font-family:var(--fm);font-size:10px;color:var(--ink-60);white-space:nowrap;margin-top:2px;opacity:.5;}

/* FILTER BAR */
.fbar{display:flex;gap:5px;margin-bottom:16px;flex-wrap:wrap;}
.fbtn{font-family:var(--fm);font-size:10px;padding:5px 11px;border-radius:4px;border:1px solid var(--border-med);background:var(--white);color:var(--ink-60);cursor:pointer;letter-spacing:.08em;text-transform:uppercase;transition:all .13s;}
.fbtn:hover{color:var(--ink);border-color:var(--ink-60);background:var(--parchment);}
.fbtn.on{background:var(--terra);color:#fff;border-color:var(--terra);}

/* CALENDAR */
.cal-wrap{background:var(--white);border:1px solid var(--border-med);border-radius:10px;padding:18px;margin-bottom:28px;overflow-x:auto;}
.cal-grid{display:grid;grid-template-columns:84px repeat(5,1fr);gap:4px;min-width:520px;}
.cal-head{font-family:var(--fm);font-size:10px;color:var(--ink-60);padding:5px 6px;text-align:center;letter-spacing:.06em;}
.cal-rl{font-family:var(--fm);font-size:9px;color:var(--ink-60);display:flex;align-items:center;padding:4px 5px;text-transform:uppercase;letter-spacing:.08em;}
.cc{border-radius:5px;padding:5px 7px;min-height:32px;font-size:11px;line-height:1.35;}
.cc.e{background:transparent;}
.cc.c-adm{background:var(--slate-l);color:var(--slate);border:1px solid rgba(58,74,92,.2);}
.cc.c-inf{background:var(--terra-l);color:var(--terra);border:1px solid var(--terra-m);}
.cc.c-cmp{background:var(--olive-l);color:var(--olive);border:1px solid var(--olive-m);}
.cc.c-hit{background:var(--amber-l);color:var(--amber);border:1px solid var(--amber-m);font-weight:600;}
.cc.c-obr{background:var(--danger-l);color:var(--danger);border:1px solid rgba(158,32,32,.25);}
.cal-sep{grid-column:1/-1;font-family:var(--fm);font-size:9px;color:var(--ink-60);text-transform:uppercase;letter-spacing:.12em;padding:12px 0 5px;border-top:1px solid var(--border-med);margin-top:7px;}
.cal-sum-sep{grid-column:1/-1;height:1px;background:var(--border-med);margin:5px 0 2px;}
.cal-sum-lbl{font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;padding:3px 5px;}
.csc{border-radius:4px;padding:4px 6px;min-height:0;font-family:var(--fm);font-size:10px;line-height:1.4;text-align:right;}
.csc.e{background:transparent;}
.csc.ef{background:var(--danger-l);color:var(--danger);border:1px solid rgba(158,32,32,.2);}
.csc.tr{background:var(--olive-l);color:var(--olive);border:1px solid var(--olive-m);}
.csc.tot{background:var(--amber-l);color:var(--amber);border:1px solid var(--amber-m);font-weight:600;}
.csc-t{font-size:8px;opacity:.7;display:block;margin-bottom:1px;}
.cal-tot-bar{grid-column:1/-1;display:flex;justify-content:flex-end;align-items:baseline;gap:22px;padding:9px 5px 3px;border-top:1px solid var(--border-med);margin-top:3px;}
.ctb-i{display:flex;align-items:baseline;gap:6px;}
.ctb-l{font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-60);}
.ctb-v{font-family:var(--fm);font-size:13px;font-weight:500;}

/* PAYMENTS */
.ptable{background:var(--white);border:1px solid var(--border-med);border-radius:10px;overflow:hidden;margin-bottom:0;}
.p-hdr{display:grid;grid-template-columns:1fr 120px 100px 110px;gap:12px;padding:9px 18px;background:var(--parchment);border-bottom:1px solid var(--border-med);font-family:var(--fm);font-size:9px;color:var(--ink-60);letter-spacing:.12em;text-transform:uppercase;}
.p-row{display:grid;grid-template-columns:1fr 120px 100px 110px;gap:12px;padding:10px 18px;border-bottom:0.5px solid var(--border);align-items:center;transition:background .11s;}
.p-row:hover{background:var(--parchment);}
.p-row:last-child{border-bottom:none;}
.p-total{display:flex;justify-content:flex-end;align-items:baseline;gap:11px;padding:13px 18px;background:var(--terra-l);border-top:1px solid var(--terra-m);border-radius:0 0 10px 10px;}
.pt-lbl{font-family:var(--fm);font-size:11px;color:var(--terra);letter-spacing:.06em;text-transform:uppercase;opacity:.8;}
.pt-val{font-family:var(--fd);font-size:28px;color:var(--terra);letter-spacing:.02em;}
.pnote{background:var(--amber-l);border:1px solid var(--amber-m);border-radius:8px;padding:11px 15px;font-family:var(--fm);font-size:11px;color:var(--amber);line-height:1.6;margin-top:13px;margin-bottom:28px;}

/* TIMELINE */
.tl{position:relative;padding-left:24px;margin-bottom:28px;}
.tl::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:1px;background:var(--border-med);}
.tl-item{position:relative;margin-bottom:20px;}
.tl-dot{position:absolute;left:-21px;top:6px;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--border-med);background:var(--white);}
.tl-dot.active{border-color:var(--terra);background:var(--terra);}
.tl-dot.hito{border-color:var(--amber);background:var(--amber);}
.tl-date{font-family:var(--fm);font-size:10px;color:var(--ink-60);letter-spacing:.06em;margin-bottom:3px;}
.tl-title{font-size:14px;color:var(--ink);font-weight:500;margin-bottom:4px;}
.tl-desc{font-size:12px;color:var(--ink-60);line-height:1.5;}
.tl-hito{display:inline-block;font-family:var(--fm);font-size:9px;padding:2px 8px;border-radius:3px;background:var(--amber-l);color:var(--amber);border:1px solid var(--amber-m);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;}

/* TEAM */
.team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:28px;}
.tcard{background:var(--white);border:1px solid var(--border-med);border-radius:10px;padding:17px;transition:box-shadow .17s;}
.tcard:hover{box-shadow:0 2px 12px var(--ink-20);}
.tav{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:15px;letter-spacing:.05em;margin-bottom:11px;}
.tname{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:2px;}
.trole{font-size:11px;color:var(--ink-60);margin-bottom:11px;line-height:1.4;}
.tcount{font-size:22px;font-family:var(--fd);letter-spacing:.02em;color:var(--ink);}
.ttasks{font-family:var(--fm);font-size:10px;color:var(--ink-60);}

/* URGENT CONTAINER */
.urg-box{background:var(--white);border:1px solid var(--border-med);border-radius:10px;overflow:hidden;padding:7px 0;margin-bottom:28px;}

/* CASHFLOW */
.cf-wrap{margin-bottom:28px;}
.cf-week{background:var(--white);border:1px solid var(--border-med);border-radius:10px;overflow:hidden;margin-bottom:12px;}
.cf-week-hdr{display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center;padding:13px 18px;background:var(--parchment);border-bottom:1px solid var(--border);}
.cf-week-title{font-family:var(--fd);font-size:16px;letter-spacing:.08em;color:var(--ink);}
.cf-week-dates{font-family:var(--fm);font-size:10px;color:var(--ink-60);}
.cf-week-total{font-family:var(--fd);font-size:22px;letter-spacing:.02em;}
.cf-rows{padding:4px 0 8px;}
.cf-row{display:grid;grid-template-columns:18px 1fr 120px 90px;gap:10px;padding:8px 18px;align-items:center;border-bottom:0.5px solid var(--border);font-size:13px;}
.cf-row:last-child{border-bottom:none;}
.cf-row:hover{background:var(--parchment);}
.cf-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.cf-cat{font-size:11px;color:var(--ink-60);font-family:var(--fm);text-transform:uppercase;letter-spacing:.07em;margin-top:2px;}
.cf-monto{font-family:var(--fm);font-size:13px;font-weight:500;text-align:right;}
.cf-tipo{text-align:right;}
.cf-week-footer{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:var(--parch2);border-top:1px solid var(--border-med);}
.cf-footer-col{text-align:center;}
.cf-footer-lbl{font-family:var(--fm);font-size:9px;color:var(--ink-60);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px;}
.cf-footer-val{font-family:var(--fm);font-size:13px;font-weight:500;}
.cf-grand{background:var(--terra-l);border:1px solid var(--terra-m);border-radius:10px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.cf-grand-left{font-family:var(--fm);font-size:10px;color:var(--terra);text-transform:uppercase;letter-spacing:.1em;}
.cf-grand-num{font-family:var(--fd);font-size:32px;color:var(--terra);letter-spacing:.02em;}
.cf-grand-sub{font-family:var(--fm);font-size:10px;color:rgba(184,74,32,.6);margin-top:2px;}
.cf-alert{font-family:var(--fm);font-size:11px;line-height:1.6;padding:11px 15px;border-radius:8px;margin-bottom:12px;}
.cf-alert.warn{background:var(--amber-l);border:1px solid var(--amber-m);color:var(--amber);}
.cf-alert.ok{background:var(--olive-l);border:1px solid var(--olive-m);color:var(--olive);}
.cf-chart-wrap{background:var(--white);border:1px solid var(--border-med);border-radius:10px;padding:18px;margin-bottom:12px;}

/* MERCH */
.merch-prow{background:var(--white);border:1px solid var(--border-med);border-radius:10px;margin-bottom:7px;overflow:hidden;transition:box-shadow .17s;}
.merch-prow:hover{box-shadow:0 2px 10px var(--ink-20);}
.merch-prow.urg{border-left:3px solid var(--danger);}
.merch-ph{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:10px 16px;border-bottom:0.5px solid var(--border);}
.merch-cat{font-family:var(--fm);font-size:9px;color:var(--ink-60);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px;}
.merch-name{font-size:14px;font-weight:500;color:var(--ink);}
.merch-pb{padding:8px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--parchment);}
::-webkit-scrollbar-thumb{background:var(--parch2);border-radius:2px;}
::-webkit-scrollbar-thumb:hover{background:var(--border-med);}

/* BOT */
.bot-fab{position:fixed;bottom:24px;right:24px;width:48px;height:48px;border-radius:50%;background:var(--terra);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(184,74,32,.4);z-index:200;transition:transform .15s,box-shadow .15s;}
.bot-fab:hover{transform:scale(1.07);box-shadow:0 6px 22px rgba(184,74,32,.5);}
.bot-fab svg{width:22px;height:22px;fill:#fff;}
.bot-panel{position:fixed;bottom:82px;right:24px;width:360px;max-height:520px;background:var(--white);border:1px solid var(--border-med);border-radius:14px;box-shadow:0 8px 32px rgba(26,20,16,.18);z-index:200;display:flex;flex-direction:column;overflow:hidden;transition:opacity .18s,transform .18s;}
.bot-panel.hidden{opacity:0;pointer-events:none;transform:translateY(10px);}
.bot-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--parchment);}
.bot-title{font-family:var(--fd);font-size:16px;letter-spacing:.06em;color:var(--terra);}
.bot-subtitle{font-family:var(--fm);font-size:9px;color:var(--ink-60);letter-spacing:.08em;text-transform:uppercase;margin-top:1px;}
.bot-api-row{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;gap:6px;align-items:center;background:var(--parch2);}
.bot-api-input{flex:1;font-family:var(--fm);font-size:11px;padding:5px 8px;border-radius:5px;border:1px solid var(--border-med);background:var(--white);color:var(--ink);outline:none;}
.bot-api-input:focus{border-color:var(--terra);}
.bot-api-btn{font-family:var(--fm);font-size:10px;padding:5px 10px;border-radius:5px;border:1px solid var(--terra-m);background:var(--terra-l);color:var(--terra);cursor:pointer;white-space:nowrap;letter-spacing:.05em;}
.bot-api-btn.saved{background:var(--olive-l);border-color:var(--olive-m);color:var(--olive);}
.bot-msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
.bot-msg{padding:8px 11px;border-radius:8px;font-size:12px;line-height:1.5;max-width:92%;}
.bot-msg.user{background:var(--terra-l);color:var(--ink);align-self:flex-end;border-bottom-right-radius:3px;}
.bot-msg.assistant{background:var(--parchment);color:var(--ink);align-self:flex-start;border-bottom-left-radius:3px;}
.bot-msg.system{background:var(--olive-l);color:var(--olive);font-family:var(--fm);font-size:11px;align-self:center;text-align:center;border-radius:6px;}
.bot-msg.err{background:var(--danger-l);color:var(--danger);font-family:var(--fm);font-size:11px;align-self:center;}
.bot-typing{display:flex;gap:4px;padding:8px 12px;align-self:flex-start;}
.bot-typing span{width:6px;height:6px;border-radius:50%;background:var(--ink-60);animation:blink 1.2s infinite;}
.bot-typing span:nth-child(2){animation-delay:.2s;}
.bot-typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.bot-input-row{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:7px;align-items:flex-end;}
.bot-textarea{flex:1;font-family:var(--fb);font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid var(--border-med);background:var(--cream);color:var(--ink);resize:none;outline:none;line-height:1.4;max-height:90px;overflow-y:auto;}
.bot-textarea:focus{border-color:var(--terra);}
.bot-send{width:34px;height:34px;border-radius:8px;background:var(--terra);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .13s;}
.bot-send:hover{background:var(--terra-dark,#8b3518);}
.bot-send:disabled{background:var(--parch2);cursor:not-allowed;}
.bot-send svg{width:15px;height:15px;fill:#fff;}
.bot-close{background:none;border:none;cursor:pointer;color:var(--ink-60);font-size:18px;padding:0 2px;line-height:1;}
.bot-close:hover{color:var(--ink);}
@media(max-width:900px){.bot-panel{width:calc(100vw - 32px);right:16px;bottom:76px;}.bot-fab{bottom:16px;right:16px;}}

</head>

// ── LOCALSTORAGE ─────────────────────────────────────────────────
const LS_KEY='ginoteca_v3';

function saveState(){
  try{
    const state={
      tasks: tasks.map(t=>({id:t.id, done:t.done, week:t.week})),
      saved: new Date().toISOString()
    };
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    // flash indicator
    const ind=document.getElementById('save-ind');
    if(ind){ ind.style.opacity='1'; setTimeout(()=>ind.style.opacity='0',1200); }
  }catch(e){}
}

function loadState(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw)return;
    const state=JSON.parse(raw);
    if(!state.tasks)return;
    state.tasks.forEach(s=>{
      const t=tasks.find(x=>x.id===s.id);
      if(t){ t.done=s.done; t.week=s.week; }
    });
    // show last saved time in topbar
    if(state.saved){
      const d=new Date(state.saved);
      const lbl=document.getElementById('save-lbl');
      if(lbl) lbl.textContent=`guardado ${d.getDate()}/${d.getMonth()+1} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }
  }catch(e){}
}

// ── UTILS ─────────────────────────────────────────────────────────
function fp(n){return n==null?'—':'$'+Math.round(n).toLocaleString('es-AR');}
function chip(cls,t){return `<span class="chip ${cls}">${t}</span>`;}

function taskChips(t){
  const m=CAT_META[t.cat];
  let h=chip(m.cls,m.label);
  if(t.urg) h+=chip('ch-urg','Urgente');
  if(t.day) h+=chip('ch-date',t.day);
  if(t.monto) h+=chip('ch-pesos',fp(t.monto));
  if(t.pago)  h+=chip('ch-who',t.pago);
  t.who.forEach(w=>h+=chip('ch-who',w));
  return h;
}

function taskRow(t,sw=false){
  const dc=t.urg?'urg':'';
  return `<div class="trow${t.done?' done':''}" onclick="toggle(${t.id})">
    <div class="tdot ${dc}">${t.done?'<svg width="8" height="8" viewBox="0 0 8 8"><polyline points="1,4 3.5,6.5 7,1.5" fill="none" stroke="#3d5a3e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</div>
    <div class="tb"><div class="tname">${t.name}</div><div class="tchips">${taskChips(t)}</div></div>
    <div class="tright">${sw?'S'+t.week:''}</div>
  </div>`;
}

function toggle(id){const t=tasks.find(x=>x.id===id);if(t){t.done=!t.done;saveState();renderAll();}}

function exportCSV(){
  const filtered=tasks.filter(t=>{
    const catOk=catFilter==='all'||t.cat===catFilter;
    const userOk=userFilter==='all'||t.who.includes(userFilter);
    return catOk&&userOk;
  });
  const CAT_LABEL={admin:'Administrativo',infra:'Infraestructura',compra:'Compras',comerc:'Comercial'};
  const W_LABEL={1:'Semana 1 (12–16 may)',2:'Semana 2 (19–23 may)',3:'Semana 3 (26–30 may)',4:'Semana 4 (2–6 jun)'};
  const rows=[['ID','Tarea','Categoría','Semana','Fecha','Responsables','Monto','Forma pago','Estado']];
  filtered.forEach(t=>{
    rows.push([
      t.id,
      `"${t.name}"`,
      CAT_LABEL[t.cat]||t.cat,
      W_LABEL[t.week]||'S'+t.week,
      t.day||'',
      t.who.join(' / '),
      t.monto?t.monto:'',
      t.pago||'',
      t.done?'Completada':'Pendiente'
    ]);
  });
  const csv=rows.map(r=>r.join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const uLabel=userFilter!=='all'?`_${userFilter}`:'_todos';
  const cLabel=catFilter!=='all'?`_${catFilter}`:'';
  a.href=url; a.download=`ginoteca_tareas${uLabel}${cLabel}.csv`; a.click();
  URL.revokeObjectURL(url);
}

const PAGES=['dashboard','cashflow','backlog','calendario','pagos','mercaderia','timeline','equipo'];
function sp(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  const idx=PAGES.indexOf(name);
  if(idx>=0) document.querySelectorAll('.nav-item')[idx].classList.add('active');
}

function updateDate(){
  const d=new Date();

  const M=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];

}

      <div class="bot-title">ASISTENTE</div>
      <div class="bot-subtitle">Command Center · actualizaciones de datos</div>
    </div>
    <button class="bot-close" onclick="toggleBot()">×</button>
  </div>
  <div class="bot-api-row">
    <input class="bot-api-input" id="bot-api-key" type="password" placeholder="API Key (sk-ant-...)" />
    <button class="bot-api-btn" id="bot-api-btn" onclick="saveApiKey()">Guardar</button>
  </div>
  <div class="bot-msgs" id="bot-msgs">
    <div class="bot-msg system">Hola. Decime qué dato querés actualizar y lo aplico directo al Command Center.<br><br>Ejemplos:<br>· "Pagamos $180.000 a CAGNOLI por 8 SKUs"<br>· "La cortadora costó $1.100.000 en 12 cuotas"<br>· "Marcar inicio de obra como completado"<br>· "El piso costó $420.000"</div>
  </div>
  <div class="bot-input-row">
    <textarea class="bot-textarea" id="bot-input" rows="1" placeholder="Escribí el cambio..." onkeydown="botKeydown(event)" oninput="autoResize(this)"></textarea>
    <button class="bot-send" id="bot-send-btn" onclick="sendBot()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
// ── BOT ──────────────────────────────────────────────────────────
const BOT_KEY='ginoteca_apikey';
let botOpen=false, botLoading=false;

function toggleBot(){
  botOpen=!botOpen;
  document.getElementById('bot-panel').classList.toggle('hidden',!botOpen);
  if(botOpen){
    const saved=localStorage.getItem(BOT_KEY);
    if(saved){
      document.getElementById('bot-api-key').value=saved;
      document.getElementById('bot-api-btn').textContent='✓ Guardada';
      document.getElementById('bot-api-btn').classList.add('saved');
    }
    setTimeout(()=>document.getElementById('bot-input').focus(),100);
  }
}

function saveApiKey(){
  const k=document.getElementById('bot-api-key').value.trim();
  if(!k){alert('Ingresá una API key válida.');return;}
  localStorage.setItem(BOT_KEY,k);
  const btn=document.getElementById('bot-api-btn');
  btn.textContent='✓ Guardada'; btn.classList.add('saved');
}

function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,90)+'px';}

function botKeydown(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendBot();}}

function addMsg(role,text){
  const el=document.createElement('div');
  el.className=`bot-msg ${role}`;
  el.innerHTML=text.replace(/\n/g,'<br>');
  document.getElementById('bot-msgs').appendChild(el);
  document.getElementById('bot-msgs').scrollTop=99999;
  return el;
}

function showTyping(){
  const el=document.createElement('div');
  el.className='bot-typing'; el.id='bot-typing';
  el.innerHTML='<span></span><span></span><span></span>';
  document.getElementById('bot-msgs').appendChild(el);
  document.getElementById('bot-msgs').scrollTop=99999;
}

function hideTyping(){const el=document.getElementById('bot-typing');if(el)el.remove();}

// Build current state snapshot for context
function buildContext(){
  const snap=tasks.map(t=>({
    id:t.id, name:t.name, cat:t.cat, week:t.week,
    done:t.done, monto:t.monto, pago:t.pago, day:t.day, who:t.who
  }));

  // Cashflow confirmed totals
  const cfConf=CF_WEEKS.flatMap(w=>w.items).reduce((a,i)=>a+(i.ef||0)+(i.trj||0),0);

  return `Sos el asistente de datos del Command Center de apertura de GINOTECA (almacén gourmet y ginoteca, Mar del Plata, Argentina).

Tu función es EXCLUSIVAMENTE interpretar instrucciones del usuario en lenguaje natural y devolver un JSON con las modificaciones a aplicar al sistema. No charlás, no explicás, solo devolvés JSON.

ESTADO ACTUAL DE TAREAS (${tasks.length} tareas):
${JSON.stringify(snap,null,2)}

REGLAS:
1. Siempre respondé SOLO con un objeto JSON válido, sin markdown, sin texto extra.
2. El JSON debe tener esta estructura:
{
  "accion": "update_tasks" | "add_task" | "message",
  "cambios": [ { "id": NUMBER, "campo": "done"|"monto"|"pago"|"day"|"week"|"name", "valor": ANY } ],
  "nueva_tarea": { "name": "", "cat": "admin"|"infra"|"compra"|"comerc", "week": 1-4, "day": "", "urg": false, "monto": null, "pago": null, "who": ["MG"] },
  "mensaje": "texto corto de confirmación para mostrar al usuario"
}
3. Si la instrucción es solo una pregunta o no requiere cambio, usá accion:"message" con el campo "mensaje".
4. Para marcar como pagado/completado, cambiar done a true.
5. Los montos siempre en pesos argentinos (números, sin $, sin puntos de miles).
6. Podés hacer múltiples cambios en un solo JSON (array "cambios").
7. Si agregás una tarea nueva, usá accion:"add_task" y completá "nueva_tarea".
8. En "mensaje" siempre confirmá qué se hizo en una línea concisa.`;
}

async function sendBot(){
  if(botLoading)return;
  const input=document.getElementById('bot-input');
  const text=input.value.trim();
  if(!text)return;
  const apiKey=localStorage.getItem(BOT_KEY)||document.getElementById('bot-api-key').value.trim();
  if(!apiKey||!apiKey.startsWith('sk-')){
    addMsg('err','⚠ Ingresá tu API key primero (sk-ant-...)');
    return;
  }

  addMsg('user',text);
  input.value=''; input.style.height='auto';
  botLoading=true;
  document.getElementById('bot-send-btn').disabled=true;
  showTyping();

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system: buildContext(),
        messages:[{role:'user',content:text}]
      })
    });

    hideTyping();

    if(!res.ok){
      const err=await res.json().catch(()=>({}));
      addMsg('err',`Error API: ${err.error?.message||res.status}`);
      return;
    }

    const data=await res.json();
    const raw=data.content?.find(b=>b.type==='text')?.text||'';

    let parsed;
    try{
      const clean=raw.replace(/```json|```/g,'').trim();
      parsed=JSON.parse(clean);
    }catch(e){
      addMsg('err','No pude interpretar la respuesta. Intentá de nuevo.');
      console.error('Bot parse error:',raw);
      return;
    }

    // Apply changes
    if(parsed.accion==='update_tasks'&&parsed.cambios?.length){
      parsed.cambios.forEach(c=>{
        const t=tasks.find(x=>x.id===c.id);
        if(t) t[c.campo]=c.valor;
      });
      saveState();
      renderAll();
    }

    if(parsed.accion==='add_task'&&parsed.nueva_tarea){
      const nt=parsed.nueva_tarea;
      const newId=Math.max(...tasks.map(t=>typeof t.id==='number'?t.id:0))+1;
      tasks.push({
        id:newId, name:nt.name||'Nueva tarea',
        cat:nt.cat||'compra', week:nt.week||1,
        day:nt.day||'', urg:nt.urg||false,
        monto:nt.monto||null, pago:nt.pago||null,
        who:nt.who||['MG'], done:false
      });
      saveState();
      renderAll();
    }

    addMsg('assistant', parsed.mensaje||'Listo.');

  }catch(e){
    hideTyping();
    addMsg('err','Error de red. Verificá tu conexión.');
    console.error(e);
  }finally{
    botLoading=false;
    document.getElementById('bot-send-btn').disabled=false;
  }
}
</script>
</body>
</html>
